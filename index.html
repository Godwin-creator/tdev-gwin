<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Équipe Gwin</title>
  <style>
    :root {
      --fond: #111111;
      --texte: #f5f5f5;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--fond);
      color: var(--texte);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      padding: 0 16px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 12vw, 6rem);
      font-weight: 800;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Équipe Gwin</h1>
</body>
</html>
